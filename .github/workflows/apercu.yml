# Les 7 vidéos d'une semaine, AVANT validation, pour les regarder et relire les fiches.
# Résultat : Actions → ce lancement → Artifacts → « apercu-… » (fichier zip à télécharger).
name: Aperçu de la semaine
on:
  workflow_dispatch:
    inputs:
      semaine:
        description: "N'importe quel jour de la semaine voulue (AAAA-MM-JJ). Vide = la semaine prochaine."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      SEMAINE: ${{ github.event.inputs.semaine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m auprogramme.pipeline verifier
      - run: |
          if [ -n "$SEMAINE" ]; then python -m auprogramme.pipeline apercu --semaine "$SEMAINE"; else python -m auprogramme.pipeline apercu; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apercu-${{ github.run_id }}
          path: output/
          retention-days: 14
