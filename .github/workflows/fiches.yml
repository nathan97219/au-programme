# Chaque mercredi : le robot prépare les 7 fiches de la semaine suivante (thème + ordre tiré au sort).
# Gemini PROPOSE des mesures avec leurs sources ; le code ne garde que ce qu'il a vérifié dans la page source
# (site reconnu, date récente, chiffres, citation mot pour mot, relecture). Puis ménage des anciennes fiches.
# Un résumé arrive sur Telegram. Pour corriger une fiche : la modifier dans contenu/ ; pour la bloquer : « statut: bloque ».
name: Préparer les fiches de la semaine
on:
  schedule:
    - cron: "43 6 * * 3"     # mercredi 08:43 à Paris en été (07:43 en hiver)
  workflow_dispatch:
    inputs:
      semaine:
        description: "N'importe quel jour de la semaine voulue (AAAA-MM-JJ). Vide = la semaine prochaine."
        required: false
        default: ""
      refaire:
        description: "Refaire aussi les fiches déjà prêtes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fiches
  cancel-in-progress: false

jobs:
  fiches:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      SEMAINE: ${{ github.event.inputs.semaine }}
      REFAIRE: ${{ github.event.inputs.refaire }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rechercher et vérifier les propositions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OPTS=""
          [ -n "$SEMAINE" ] && OPTS="$OPTS --semaine $SEMAINE"
          [ "$REFAIRE" = "true" ] && OPTS="$OPTS --refaire"
          python -m auprogramme.pipeline preparer-semaine $OPTS
      - name: Contrôles (tests + neutralité)
        run: |
          python -m pytest -q
          python -m auprogramme.pipeline verifier
      - name: Enregistrer les fiches
        run: |
          git config user.name "auprogramme-bot"
          git config user.email "auprogramme-bot@users.noreply.github.com"
          git add -A contenu/
          git diff --cached --quiet || (git commit -m "Fiches de la semaine (robot de recherche)" && git pull --rebase && git push)
      - name: Prévenir sur Telegram en cas d'échec
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⛔ Au Programme : la préparation des fiches de la semaine a échoué. Détails : ${LIEN}" > /dev/null || true
