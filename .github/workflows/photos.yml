# Récupère les photos libres de droits des candidats (Wikipédia / Wikimedia Commons) avec leur crédit,
# puis les enregistre dans le dépôt (assets/candidats/). À relancer si un candidat change.
name: Photos des candidats
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m auprogramme.pipeline photos
      - run: |
          git config user.name "auprogramme-bot"
          git config user.email "auprogramme-bot@users.noreply.github.com"
          git add assets/candidats/
          git diff --cached --quiet || (git commit -m "Photos des candidats (licences libres)" && git push)
